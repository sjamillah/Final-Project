name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - &checkout-step
        name: Checkout code
        uses: actions/checkout@v4

      - &setup-python-step
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Black check
        run: poetry run black --check --target-version py310 apps config manage.py

      - name: Run Ruff check
        run: poetry run ruff check .

  tests:
    name: Django Tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: sqlite:///test.db
      DEBUG: "True"

    steps:
      - *checkout-step
      - *setup-python-step

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -q --cov=apps --cov-report=term-missing